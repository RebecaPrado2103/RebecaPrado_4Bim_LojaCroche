<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho | Entre Laços</title>

    <link rel="stylesheet" href="../inicio/inicio.css">
    <link rel="stylesheet" href="carrinho.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <a href="../inicio/index.html" class="logo">
            Entre Laços
        </a>

        <nav class="menu">
            <a href="../inicio/index.html">Início</a>
            <a href="../produto/index.html">Produtos</a>
        </nav>

        <div class="acoes">
            <a href="index.html">Carrinho</a>
        </div>

    </header>

    <!-- CARRINHO -->
    <main class="pagina-carrinho">

        <div class="titulo-carrinho">
            <span>SUA SACOLA</span>
            <h1>Meu carrinho</h1>
            <p>Confira suas peças favoritas antes de finalizar a compra.</p>
        </div>

        <div class="conteudo-carrinho">

            <!-- LISTA DE PRODUTOS -->
            <section class="lista-carrinho">

                <div id="itens-carrinho">
                    <p>Carregando carrinho...</p>
                </div>

            </section>

            <!-- RESUMO DA COMPRA -->
            <aside class="resumo-carrinho">

                <h2>Resumo do pedido</h2>

                <div class="resumo-linha">
                    <span>Subtotal</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>

                <div class="resumo-linha total">
                    <span>Total</span>
                    <span id="total">R$ 0,00</span>
                </div>

                <button class="botao-finalizar" disabled>
                    Finalizar compra
                </button>

                <a href="../produto/index.html" class="continuar-comprando">
                    Continuar comprando
                </a>

            </aside>

        </div>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>Entre Laços — Feito à mão, com carinho em cada ponto.</p>
    </footer>

    <script src="carrinho.js"></script>

</body>

</html>
