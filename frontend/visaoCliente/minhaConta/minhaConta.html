<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Conta | Entre Laços</title>

    <link rel="stylesheet" href="minhaConta.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <div class="logo">
            <h1>Entre Laços</h1>
            <p>Feito à mão, com carinho.</p>
        </div>

        <nav class="menu">
            <a href="../inicio/index.html">Início</a>
            <a href="../produto/produto.html">Produtos</a>
            <a href="../carrinho/carrinho.html">Carrinho</a>
        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <section class="cartao-conta">

            <h2>Minha Conta</h2>

            <p class="descricao">
                Consulte e mantenha seus dados atualizados.
            </p>

            <!-- MENSAGEM DE RETORNO -->
            <p id="mensagem-conta" role="status"></p>

            <!-- DADOS DO CLIENTE -->
            <form id="form-minha-conta">

                <div class="campo">
                    <label for="nome-pessoa">Nome</label>
                    <input
                        type="text"
                        id="nome-pessoa"
                        name="nome_pessoa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cpf-pessoa">CPF</label>
                    <input
                        type="text"
                        id="cpf-pessoa"
                        name="cpf_pessoa"
                        readonly
                    >
                </div>

                <div class="campo">
                    <label for="email-pessoa">E-mail</label>
                    <input
                        type="email"
                        id="email-pessoa"
                        name="email_pessoa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="data-nascimento-pessoa">
                        Data de nascimento
                    </label>
                    <input
                        type="date"
                        id="data-nascimento-pessoa"
                        name="data_nascimento_pessoa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="endereco-pessoa">Endereço</label>
                    <textarea
                        id="endereco-pessoa"
                        name="endereco_pessoa"
                        rows="3"
                        required
                    ></textarea>
                </div>

                <!-- BOTÃO DE SALVAR -->
                <button type="submit" id="btn-salvar-conta">
                    Salvar alterações
                </button>

            </form>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>Entre Laços — Feito à mão, com carinho.</p>
    </footer>

    <script src="minhaConta.js"></script>

</body>

</html>
