<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Entre Laços</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="pagina-cadastro">

        <section class="cartao-cadastro">

            <!-- IDENTIDADE DA LOJA -->
            <div class="logo">
                <h1>Entre Laços</h1>
                <p>Feito à mão, com carinho.</p>
            </div>

            <!-- TÍTULO -->
            <div class="titulo-cadastro">
                <h2>Crie sua conta</h2>
                <p>Preencha seus dados para fazer parte da nossa loja!</p>
            </div>

            <!-- FORMULÁRIO -->
            <form id="form-cadastro">

                <div id="mensagem-cadastro" class="mensagem-cadastro" role="status"></div>

                <div class="grupo-campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome completo" required>
                </div>

                <div class="grupo-campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf"
                        placeholder="000.000.000-00" required>
                </div>

                <div class="grupo-campo">
                    <label for="data-nascimento">Data de nascimento</label>
                    <input type="date" id="data-nascimento"
                        name="dataNascimento" required>
                </div>

                <div class="grupo-campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                        placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco"
                        placeholder="Rua, avenida..." required>
                </div>

                <div class="grupo-campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="Crie uma senha" required>
                </div>

                <div class="grupo-campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha"
                        name="confirmarSenha"
                        placeholder="Digite sua senha novamente" required>
                </div>

                <button type="submit" class="botao-cadastrar">
                    Criar minha conta
                </button>

            </form>

            <!-- LINK PARA LOGIN -->
            <div class="link-login">
                <p>Já possui uma conta?
                    <a href="../login/index.html">Faça login</a>
                </p>
            </div>

        </section>

    </main>

    <script src="cadastro.js"></script>

</body>
</html>
