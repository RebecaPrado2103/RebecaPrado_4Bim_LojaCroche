<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Produtos | Entre Laços</title>

    <link rel="stylesheet" href="produtos.css">
</head>

<body onload="inicializar()">

    <!-- CABEÇALHO -->
    <header>
        <h1>Entre Laços</h1>
        <p>Gerencie os produtos da nossa loja.</p>
    </header>

    <main class="container-master">

        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo-principal">

            <!-- FORMULÁRIO À ESQUERDA -->
            <section class="form-esquerda">

                <h2>Dados do Produto</h2>

                <label for="inputId_produto">ID do Produto</label>

                <div class="linha-id">
                    <input type="text" id="inputId_produto" placeholder="Ex: 1">

                    <input type="button" value="Procure" id="btProcure">
                    <input type="button" value="Inserir" id="btInserir">
                    <input type="button" value="Alterar" id="btAlterar">
                    <input type="button" value="Desativar" id="btDesativar">
                    <input type="button" value="Reativar" id="btReativar">
                </div>

                <label for="inputNome_produto">Nome do Produto</label>
                <input type="text" id="inputNome_produto">

                <label for="inputQuantidade_produto">Quantidade em Estoque</label>
                <input type="number" id="inputQuantidade_produto" min="0">

                <label for="inputPreco_produto">Preço Unitário (R$)</label>
                <input type="number" id="inputPreco_produto" min="0.01" step="0.01">

                <label for="inputCategoria_produto">Categoria</label>
                <input type="text" id="inputCategoria_produto">

                <label>
                    <input type="checkbox" id="inputDestaque_produto">
                    Produto em destaque
                </label>

                <div id="divAviso">
                    Informe o ID e clique em Procure.
                </div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar">
                    <input type="button" value="Cancelar" id="btCancelar">
                </div>

            </section>

            <!-- IMAGEM À DIREITA -->
            <aside class="form-direita">

                <h2>Imagem do Produto</h2>

                <p class="instrucao-imagem">
                    Clique na imagem para selecionar uma PNG.
                </p>

                <div class="img-container">

                    <img id="imgProduto" src="http://127.0.0.1:3001/imagens/silhueta.png" alt="Imagem do produto">

                    <input type="file" id="inputImagem" accept="image/png" hidden>

                </div>

            </aside>

        </div>

        <!-- LISTAGEM -->
        <section class="lista-produtos">

            <h3>Produtos Cadastrados</h3>

            <div id="outputSaida">
                Carregando produtos...
            </div>

        </section>

    </main>

    <script src="produtos.js"></script>

</body>

</html>
