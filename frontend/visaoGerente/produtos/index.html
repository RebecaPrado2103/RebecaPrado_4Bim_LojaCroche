<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar produtos | Entre Laços</title>

    <link rel="stylesheet" href="produtos.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <h1>Entre Laços</h1>
        <p>Painel de gerenciamento</p>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <section class="titulo-pagina">
            <h2>Gerenciamento de produtos</h2>
            <p>Visualize e organize os produtos da loja.</p>
        </section>

        <!-- AÇÕES -->
        <section class="acoes-produtos">
            <button id="botao-cadastrar">
                Cadastrar produto
            </button>
        </section>


        <!-- FORMULÁRIO DE CADASTRO -->
        <section class="formulario-produto" id="formulario-produto" hidden>

            <h3>Cadastrar novo produto</h3>

            <form id="form-cadastro-produto">

                <!-- NOME -->
                <div class="campo-formulario">
                    <label for="nome-produto">Nome do produto:</label>
                    <input type="text" id="nome-produto" name="nome_produto" required>
                </div>

                <!-- QUANTIDADE -->
                <div class="campo-formulario">
                    <label for="quantidade-produto">Quantidade em estoque:</label>
                    <input type="number" id="quantidade-produto" name="quantidade_estoque_produto" min="0" step="1"
                        required>
                </div>

                <!-- PREÇO -->
                <div class="campo-formulario">
                    <label for="preco-produto">Preço unitário (R$):</label>
                    <input type="number" id="preco-produto" name="preco_unitario_produto" min="0.01" step="0.01"
                        required>
                </div>

                <!-- CATEGORIA -->
                <div class="campo-formulario">
                    <label for="categoria-produto">Categoria:</label>
                    <input type="text" id="categoria-produto" name="categoria_produto">
                </div>

                <!-- IMAGEM -->
                <div class="campo-formulario">
                    <label for="imagem-produto">Imagem do produto (PNG):</label>
                    <input type="file" id="imagem-produto" name="imagem" accept="image/png" required>
                </div>

                <!-- DESTAQUE -->
                <div class="campo-formulario">
                    <label>
                        <input type="checkbox" id="destaque-produto" name="destaque_produto" value="true">
                        Exibir como produto em destaque
                    </label>
                </div>

                <!-- BOTÕES -->
                <div class="botoes-formulario">
                    <button type="submit">Salvar produto</button>
                    <button type="button" id="botao-cancelar">Cancelar</button>
                </div>

            </form>

        </section>


        <!-- LISTAGEM -->
        <section class="listagem-produtos">

            <h3>Produtos cadastrados</h3>

            <div id="lista-produtos">
                Carregando produtos...
            </div>

        </section>

    </main>

    <script src="produtos.js"></script>

</body>

</html>
