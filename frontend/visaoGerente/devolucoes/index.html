<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devoluções | Entre Laços</title>

    <link rel="stylesheet" href="devolucoes.css">
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>Entre Laços</h1>
            <p>Feito à mão, com carinho.</p>
        </div>

        <a href="../menu/index.html" class="voltar-menu">
            Voltar ao menu
        </a>
    </header>

    <main class="conteudo">

        <section class="introducao">
            <h2>Devoluções</h2>
            <p>
                Gerencie as devoluções realizadas presencialmente
                em nossa loja.
            </p>
        </section>

        <!-- ACESSO AO HISTÓRICO -->
        <section class="secao-historico">
            <a href="historico.html" class="botao-historico">
                Consultar histórico de devoluções
            </a>
        </section>

        <section class="secao-pedidos">
            <h3>Pedidos disponíveis</h3>

            <div id="lista-pedidos">
                <p>Carregando pedidos...</p>
            </div>
        </section>

        <section class="secao-devolucao" id="secao-devolucao" hidden>
            <h3>Registrar devolução</h3>

            <div id="informacoes-pedido"></div>

            <div id="lista-produtos"></div>

            <div class="campo">
                <label for="motivo-devolucao">
                    Motivo da devolução
                </label>

                <textarea
                    id="motivo-devolucao"
                    placeholder="Descreva o motivo da devolução..."
                    maxlength="200"
                ></textarea>
            </div>

            <button id="registrar-devolucao">
                Registrar devolução
            </button>
        </section>

    </main>

    <script src="devolucoes.js"></script>

</body>
</html>
